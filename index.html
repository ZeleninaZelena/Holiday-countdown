<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">


        <section id="section-country">
            <button class="button-country button-active" id="CZ">
                CZ
            </button>
            <button class="button-country" id="US">
                US
            </button>
            <button class="button-country" id="DE">
                DE
            </button>
        </section>

        <section id="section-countdown">
            <h2>Název svátku: <span id="holiday-name"></span></h2>
            <h2>Datum svátku: <span id="holiday-date"></span></h2>
            <h1>Odpočet</h1>
            <p id="countdown-timer">
                <span id="days"></span>:<span id="hours"></span>:<span id="minutes"></span>:<span id="seconds"></span>
            </p>
        </section>


    </div>

    <script type="module" src="script.js"></script>
</body>

</html>
